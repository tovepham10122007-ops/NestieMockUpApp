 <button class="btn o" ${st.sent[x.p.n]?"disabled":""} onclick="st.sent['${x.p.n}']=1;toast('Request sent to ${x.p.n}');draw(1)">${st.sent[x.p.n]?"Waiting: chat unlocks if both agree":"Send match request"}</button></div>`).join("")+`<div class="note">Profiles show only after both sides consent. Block and report tools are always available.</div>`}
function dep(){var r=L.find(x=>x.id==st.room),d=st.dep,S=[["Owner verified","Identity and authority checked by the Nestie team."],["View the room in person","Pick a slot. No money moves before this step."],["Digital deposit receipt","Records room, amount, parties and terms."],["Confirm move-in","Student and landlord both confirm in the app."]];
 return `<h2>Safe Deposit Protocol</h2><div class="mut">${r.n} · deposit shown: 1 month of rent (illustrative)</div><div class="bar" style="margin:10px 0"><i style="width:${d*25}%"></i></div><div class="card" style="padding:6px">`+S.map((s,i)=>`<div class="step ${i<d?"done":(i==d?"cur":"")}"><div class="dot">${i<d?"✓":i+1}</div><div style="flex:1"><b>${s[0]}</b><div class="mut">${s[1]}</div>${i==d?`<button class="btn" onclick="st.dep++;toast('Step ${i+1} complete');draw(1)">${["Continue","Book viewing: Sat 10:00","Generate receipt","Confirm move-in"][i]}</button>`:""}</div></div>`).join("")+`</div>`+
 (d>=3?`<div class="rcpt"><b>Deposit receipt #NST-0427</b><br>Room: ${r.n}<br>Amount: ${R(r.rent)} VND<br>Parties: landlord and student<br>Terms: rent, utilities and house rules as listed</div>`:"")+(d>=4?`<div class="card" style="background:var(--gl)"><b>🎉 Move-in confirmed.</b><div class="mut">A short review request follows after 30 days.</div><div class="mut" style="margin-top:8px">Day-30 check-in preview: rate your roommate</div><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip" onclick="toast('Thanks! Rating ${n}/5 recorded (demo)')">${"★".repeat(n)}</button>`).join("")}</div></div>`:"")+`<div class="note">Nestie does not hold deposits at launch. Never pay before viewing a room.</div><button class="btn o" onclick="st.dep=0;draw(1)">Restart demo</button>`}
function ldash(){return `<h2>Landlord dashboard</h2><div class="card" style="background:var(--ambl)"><b>Pilot phase: fees are VND 0</b><div class="mut">Planned from Aug 2027: VND 50,000 per 14-day vacancy listing.</div></div><div class="row" style="gap:8px">`+[["128","Views"],["14","Inquiries"],["2","Move-ins"]].map(x=>`<div class="card" style="flex:1;text-align:center;margin:0"><div style="font:900 24px system-ui;color:var(--g)">${x[0]}</div><div class="mut">${x[1]}</div></div>`).join("")+`</div><h3>Room status (updates the student map)</h3>`+
 [1,2,3].map(i=>{var r=L.find(x=>x.id==i);return `<div class="card"><div class="row sp"><b>${r.n}</b><span class="pill ${pc(r)}">${r.s}</span></div><div class="seg" style="margin-top:8px">`+["Available","Reserved","Rented"].map(s=>`<button class="${r.s==s?"on":""}" onclick="L[${i-1}].s='${s}';draw(1)">${s}</button>`).join("")+`</div></div>`}).join("")+`<button class="btn" onclick="toast('Vacancy live for 14 days (pilot: VND 0)')">Post a vacancy</button><button class="btn o" onclick="toast('Boost is for verified listings only')">Boost listing: VND 100,000 / 7 days</button>`}
function lrooms(){var r=L[1];return `<h2>Utility rates</h2><div class="mut">Shown to students as the True Monthly Cost. Listings that hide costs are flagged.</div><div class="card" style="margin-top:10px"><div class="mut" style="margin-bottom:4px">${r.n}</div><div class="row sp"><b>Electricity per kWh</b><b id="ev">${R(r.e)}</b></div><input type="range" min="2000" max="5000" step="100" value="${r.e}" oninput="L[1].e=+this.value;$('ev').textContent=R(L[1].e);$('lt').textContent=R(tc(L[1]))+' VND'"><div class="line tot" style="margin-top:8px"><span>Students will see</span><span id="lt">${R(tc(r))} VND</span></div><div class="mut">Approved tenant rate at the third level: VND 2,271 per kWh.</div></div>`}
function draw(keep){var m=$("v"),y=m.scrollTop;nav();var h;
 if(st.role=="u")h=st.tab=="uq"?uqr():uni();else if(st.role=="l")h=st.tab=="rm"?lrooms():ldash();else if(!st.on)h=onboard();else h=st.tab=="map"?(st.sel?detail():mapView()):st.tab=="sv"?saved():st.tab=="mt"?(st.chat?chat():match2()):dep();
 m.style.animation="none";m.offsetHeight;m.style.animation=keep?"none":"";m.innerHTML=(st.role=="s"&&st.on?trk():"")+h;tr(m);tr($("nav"));tr($("role"));m.scrollTop=keep?y:0}
draw();
